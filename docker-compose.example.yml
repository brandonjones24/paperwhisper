services:
  paperwhisper:
    build: .
    # or, once published:
    # image: ghcr.io/brandonjones24/paperwhisper:latest
    container_name: paperwhisper
    restart: unless-stopped
    environment:
      - RMFAKECLOUD_USER=changeme
      - ABS_URL=http://audiobookshelf:13378
      - ABS_TOKEN=${ABS_TOKEN}

      # all = every configured backend is a peer (recommended).
      - DIRECTION=all
      # To write the tablet, also set RMFAKECLOUD_URL + RMFAKECLOUD_DEVICE_TOKEN
      # (or mount an rmapi.conf and set RMAPI_CONFIG=/rmapi/rmapi.conf).
      # To write Calibre-Web, set CWA_URL + CWA_USER + CWA_PASSWORD and mount
      # the Calibre library + CWA app.db.

      - INTERVAL=300            # backup poll; also listens to ABS Socket.io when ABS is enabled
      - DRY_RUN=true            # flip to false once matches look right
      - LOG_LEVEL=INFO
      # CHAPTER_MAP=true
      # PAGE_LAG=1
      # AUDIO_LAG=15
      # - ABS_EVENTS=true
      # - EVENT_DEBOUNCE=20
      # - EVENT_MAX_WAIT=120
    volumes:
      # rmfakecloud data dir (READ-ONLY). Point at the host path containing users/<user>/sync
      - /path/to/rmfakecloud/data:/rmdata:ro
      - ./state:/state
      # For audio_to_ebook with RMAPI_CONFIG, also mount your rmapi config dir:
      # - /path/to/rmapi-config:/rmapi:ro
