services:
  paperwhisper:
    build: .
    # or, once published:
    # image: ghcr.io/CHANGEME/paperwhisper:latest
    container_name: paperwhisper
    restart: unless-stopped
    environment:
      - RMFAKECLOUD_USER=changeme
      - ABS_URL=http://audiobookshelf:80
      - ABS_TOKEN=${ABS_TOKEN}
      - DIRECTION=ebook_to_audio
      - INTERVAL=300
      - DRY_RUN=true            # flip to false once matches look right
      - LOG_LEVEL=INFO
    volumes:
      # rmfakecloud data dir (READ-ONLY). Point at the host path that contains users/<user>/sync
      - /home/brandon/rmfakecloud/data:/rmdata:ro
      - ./state:/state
