services:
  paperwhisper:
    build: .
    # or, once published:
    # image: ghcr.io/brandonjones24/paperwhisper:latest
    container_name: paperwhisper
    restart: unless-stopped
    environment:
      - RMFAKECLOUD_USER=changeme
      - ABS_URL=http://audiobookshelf:13378
      - ABS_TOKEN=${ABS_TOKEN}

      # ebook_to_audio (default, read-only on the reMarkable side):
      - DIRECTION=ebook_to_audio

      # For audio_to_ebook instead, set:
      #   - DIRECTION=audio_to_ebook
      #   - RMFAKECLOUD_URL=http://rmfakecloud:3050
      #   - RMFAKECLOUD_DEVICE_TOKEN=${RMFAKECLOUD_DEVICE_TOKEN}
      #   (or mount an rmapi.conf and set RMAPI_CONFIG=/rmapi/rmapi.conf)

      - INTERVAL=300            # backup poll; audio_to_ebook also listens to ABS Socket.io
      - DRY_RUN=true            # flip to false once matches look right
      - LOG_LEVEL=INFO
      # CHAPTER_MAP=true        # ABS chapters ↔ EPUB TOC (falls back to percent)
      # PAGE_LAG=1              # land 1 page behind so you turn forward
      # AUDIO_LAG=15            # land 15s behind on the audiobook side
      # audio_to_ebook events (defaults on for that direction):
      # - ABS_EVENTS=true
      # - EVENT_DEBOUNCE=20
      # - EVENT_MAX_WAIT=120
    volumes:
      # rmfakecloud data dir (READ-ONLY). Point at the host path containing users/<user>/sync
      - /path/to/rmfakecloud/data:/rmdata:ro
      - ./state:/state
      # For audio_to_ebook with RMAPI_CONFIG, also mount your rmapi config dir:
      # - /path/to/rmapi-config:/rmapi:ro
